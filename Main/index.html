<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/032c38c1a1.js" crossorigin="anonymous"></script>
</head>

<body>

    <!---dados do projeto--->
    <header>
        <div class="header">
            <a href="https://github.com/Codigo-Comentado" target="_blank" rel="noopener noreferrer">
                <img id="logo" src="img_codigo_comentado.png" alt="Logo-código_comentado" width="50" height="50">
            </a>
            <h1 id="ranking-title">Ranking de Colaboração</h1>
        </div>
        <div class="bloco">
            <div class="card-participantes">
                <i class="fa-regular fa-star fa-2xl" style="color: #10B981;"></i>
                <h2>Total de Participantes</h2>
                <!-- Adicionado ID aqui -->
                <h1 id="total-participantes">Carregando...</h1>
            </div>

            <div class="card-prs">
                <i class="fa-brands fa-github fa-2xl" style="color: #2563EB;"></i>
                <h2>Total de PRs</h2>
                <!-- Adicionado ID aqui -->
                <h1 id="total-prs">Carregando...</h1>
            </div>

            <div class="card-date">
                <i class="fa-regular fa-calendar fa-2xl" style="color: #7C3AED;"></i>
                <h2>Data</h2>
                <h1 id="current-date"></h1>
                <h5 id="days-left"></h5>
            </div>
        </div>
    </header>

    <!--Pódium-->
    <section>
        <div class="podium">
            <div class="card-primeiro">
                <h2 id="primeiro">1º Lugar <i class="fa-solid fa-trophy fa-lg" style="color: #D3AF37;"></i>
                </h2>
                <!-- Adicionado ID aqui -->
                <p id="nome-primeiro">-</p>
            </div>
            <div class="card-segundo">
                <h2 id="segundo">2º Lugar <i class="fa-solid fa-medal fa-lg" style="color: #CBC9C1;"></i>
                </h2>
                <!-- Adicionado ID aqui -->
                <p id="nome-segundo">-</p>
            </div>
            <div class="card-terceiro">
                <h2 id="terceiro">3º Lugar <i class="fa-solid fa-medal fa-lg" style="color: #9E4C00;"></i></h2>
                <!-- Adicionado ID aqui -->
                <p id="nome-terceiro">-</p>
            </div>
        </div>
    </section>

    <!--tabela do ranking--->
    <section>
        <div class="table-ranking">
            <h3>Ranking Geral</h3>
            <table>
                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Nome</th>
                        <th>PRs</th>
                    </tr>
                </thead>
                <!-- Adicionado ID aqui e limpado o conteúdo estático -->
                <tbody id="tabela-corpo">
                    <tr>
                        <td colspan="3" style="text-align: center;">Carregando dados do GitHub...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <!--Data e Dias Restantes // Chamada da API-->
    <section>
        <script>
            // --- CÓDIGO DA DATA (MANTIDO O SEU) ---
            const currentDate = new Date();
            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, '0');
            const day = String(currentDate.getDate()).padStart(2, '0');
            const date = document.getElementById('current-date');
            date.innerHTML = `${day}/${month}/${year}`;

            // Ajuste simples para não mostrar número negativo se passar dos 90 dias
            const diasFaltantes = 90 - Number(day);
            document.getElementById('days-left').innerText = `Faltam ${diasFaltantes > 0 ? diasFaltantes : 0} dias para o fechamento`;

            // --- FUNÇÃO DE INTEGRAÇÃO COM A API ---
            async function carregarRanking() {
                try {
                    // 1. Chama a API
                    const response = await fetch("http://localhost:8000/ranking");
                    const data = await response.json();

                    // 2. Preenche os Cards do Cabeçalho
                    document.getElementById("total-participantes").innerText = data.quantidade_contribuidores;
                    document.getElementById("total-prs").innerText = data.total_prs_aprovados;

                    const ranking = data.ranking_top_contribuidores;

                    // 3. Preenche o Pódium (verifica se a pessoa existe no ranking antes de inserir)
                    if (ranking.length > 0) document.getElementById("nome-primeiro").innerText = ranking[0][0];
                    if (ranking.length > 1) document.getElementById("nome-segundo").innerText = ranking[1][0];
                    if (ranking.length > 2) document.getElementById("nome-terceiro").innerText = ranking[2][0];

                    // 4. Preenche a Tabela Geral
                    const tabelaCorpo = document.getElementById("tabela-corpo");
                    tabelaCorpo.innerHTML = ""; // Limpa a mensagem de "Carregando..."

                    // Percorre todos os itens do ranking
                    ranking.forEach((contribuinte, index) => {
                        const nome = contribuinte[0];
                        const quantidade = contribuinte[1];
                        const posicao = index + 1; // O index começa em 0, então somamos 1

                        // Cria a linha (<tr>) e as colunas (<td>) dinamicamente
                        const linha = document.createElement("tr");
                        linha.innerHTML = `
                            <td>${posicao}</td>
                            <td>${nome}</td>
                            <td>${quantidade}</td>
                        `;

                        // Adiciona a linha na tabela HTML
                        tabelaCorpo.appendChild(linha);
                    });

                } catch (erro) {
                    console.error("Erro ao conectar com a API:", erro);
                    document.getElementById("tabela-corpo").innerHTML = `
                        <tr>
                            <td colspan="3" style="text-align: center; color: red;">
                                Erro ao carregar os dados. Verifique se o servidor FastAPI está rodando.
                            </td>
                        </tr>
                    `;
                }
            }

            // Executa a função ao carregar a página
            carregarRanking();
        </script>
    </section>
</body>

</html>
